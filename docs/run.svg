<text x="22" y="183.9" xml:space="preserve" style="white-space:pre"><tspan fill="#E6EDF3" font-weight="700">    Which category fits these inputs best? Decide whether the answer is backed by our docs.</tspan><tspan fill="#E6EDF3">         </tspan></text>
